
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | MolTol</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>



<nav class="navbar">
    <div class="container">

        <a class="navbar-brand" href="index.html">
            MolTol<span class="brand-dot">.</span>
        </a>

        <a href="index.html" class="nav-link">
            <i class="bi bi-arrow-left me-1"></i>
            Back to Home
        </a>

    </div>
</nav>



<section class="auth-section">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-md-7 col-lg-5">

                <div class="auth-card">

                    <div class="text-center mb-4">

                        <div class="category-icon mx-auto">
                            <i class="bi bi-person-circle"></i>
                        </div>

                        <h2 class="auth-title">Welcome Back!</h2>

                        <p class="text-secondary">
                            Login to your MolTol account.
                        </p>

                    </div>


                    <form>

                        <div class="mb-3">

                            <label class="form-label">Email Address</label>

                            <input
                                type="email"
                                class="form-control"
                                placeholder="Enter your email"
                                required>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">Password</label>

                            <input
                                type="password"
                                class="form-control"
                                placeholder="Enter your password"
                                required>

                        </div>


                        <div class="d-flex justify-content-between align-items-center mb-4">

                            <div class="form-check">

                                <input
                                    type="checkbox"
                                    class="form-check-input"
                                    id="remember">

                                <label class="form-check-label small" for="remember">
                                    Remember me
                                </label>

                            </div>

                        </div>


                        <button type="submit" class="btn btn-primary-custom w-100">
                            Login
                        </button>

                    </form>


                    <div class="text-center mt-4">

                        <p class="small text-secondary mb-2">
                            Don't have an account?
                        </p>

                        <a href="signup.html" class="fw-semibold text-decoration-none">
                            Create an Account
                        </a>

                    </div>

                    <div class="text-center mt-3">

                        <a href="index.html" class="small text-secondary text-decoration-none">
                            Return to MolTol Homepage
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
